<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signup-Page</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="sidebar_container">
      <p>
        Photo by
        <a
          href="https://unsplash.com/photos/25xggax4bSA"
          target="_blank"
          rel="noopener noreferrer"
          >Halie West</a
        >
        on
        <a href="http://unsplash.com" target="_blank" rel="noopener noreferrer"
          >Unsplash</a
        >
      </p>
      <div class="logo_section">
        <img
          src="./resources/odin-lined.png"
          alt="the logo that TOP provided"
          height="auto"
          width="100px" />
        <p>ODIN</p>
      </div>
    </div>
    <div class="main_container">
      <div class="explainer_text">
        <p class="explainer">
          This is not a real online service! You know you need something like
          this in your life to help you realize your deepest dreams. Sign up
          <em>now</em> to get started.<br /><br />
          You <em>know</em> you want to.
        </p>
      </div>
      <div class="submission_area">
        <form class="contact_Form" action="./test.html" method="get">
          <div class="form-row">
            <label for="firstName">first name</label>
            <input id="firstName" name="firstName" type="text" />
          </div>
          <div class="form-row">
            <label for="lastName">last name</label>
            <input id="lastName" name="lastName" type="text" />
          </div>
          <div class="form-row">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" />
          </div>
          <div class="form-row">
            <label for="phone">phone number</label>
            <input id="phone" name="phone" type="tel" />
          </div>
          <div class="form-row">
            <label for="password1">password</label>
            <input
              id="password1"
              name="password1"
              type="password"
              minlength="8"
              required />
          </div>
          <div class="form-row">
            <label for="password2">confirm password</label>
            <input
              id="password2"
              name="password2"
              type="password"
              minlength="8"
              required />
          </div>
        </form>
      </div>
      <div class="button_area">
        <button
          type="submit"
          class="createAccount"
          accesskey="s"
          form="contact_Form">
          Create Account
        </button>
        <p class="loginText">
          Already have an account?
          <a href="http://google.com" target="_blank" rel="noopener noreferrer"
            >Log in</a
          >
        </p>
      </div>
    </div>
    <script src="scripts.js"></script>
  </body>
</html>
