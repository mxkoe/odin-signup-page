<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signup-Page</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="sidebar_container">
      <p>
        Photo by
        <a
          href="https://unsplash.com/photos/25xggax4bSA"
          target="_blank"
          rel="noopener noreferrer"
          >Halie West</a
        >
        on
        <a href="http://unsplash.com" target="_blank" rel="noopener noreferrer"
          >Unsplash</a
        >
      </p>
      <div class="logo_section">
        <img
          src="./resources/odin-lined.png"
          alt="the logo that TOP provided"
          height="auto"
          width="100px" />
        <p>ODIN</p>
      </div>
    </div>
    <div class="main_container">
      <div class="explainer_text">
        <p class="explainer">
          This is not a real online service! You know you need something like
          this in your life to help you realize your deepest dreams. Sign up
          <em>now</em> to get started.<br /><br />
          You <em>know</em> you want to.
        </p>
      </div>
      <div class="submission_area">
        <form action="/" method="get" class="input-container"></form>
        <p>Let's do this!</p>
        <form>
          <div class="input-container">
            <label for="firstName">FIRST NAME</label>
            <input type="text" id="firstName" name="firstName" />
          </div>
          <div class="input-container">
            <label for="lastName">LAST NAME</label>
            <input type="text" id="lastName" name="lastName" />
          </div>
          <br />
          <div class="input-container">
            <label for="eMail">EMAIL</label>
            <input type="text" id="eMail" name="eMail" />
          </div>
          <div class="input-container">
            <label for="phoneNumber">PHONE NUMBER</label>
            <input type="tel" id="phoneNumber" name="phoneNumber" />
          </div>
          <br />
          <div class="input-container">
            <label for="password1">PASSWORD</label>
            <input type="password" id="password1" name="passwords" />
          </div>
          <div class="input-container">
            <label for="password2">CONFIRM PASSWORD</label>
            <input type="password" id="password2" name="passwords" />
          </div>
        </form>
      </div>
      <div class="button_area">
        <button class="createAccount">Create Account</button>
        <p class="loginText">
          Already have an account?
          <a href="http://" target="_blank" rel="noopener noreferrer">Log in</a>
        </p>
      </div>
    </div>
    <script src="scripts.js"></script>
  </body>
</html>
